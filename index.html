    /**
     * BMR, TDEE 與增肌目標營養素計算公式 (Mifflin-St Jeor Equation)
     */
    function calculateBulkingNutrition({
      gender = 'male',
      age = 25,
      height = 175,
      weight = 70,
      activityLevel = 1.55,
      surplus = 350
    }) {
      const w = Number(weight) || 70;
      const h = Number(height) || 175;
      const a = Number(age) || 25;
      const act = Number(activityLevel) || 1.55;
      const sur = Number(surplus) || 350;

      const baseBmr = 10 * w + 6.25 * h - 5 * a + (gender === 'male' ? 5 : -161);
      const bmr = Math.round(baseBmr);
      const tdee = Math.round(baseBmr * act);
      const targetCalories = Math.round(tdee + sur);

      const protein = Math.round(w * 2.0);
      const proteinCalories = protein * 4;

      const fat = Math.round((targetCalories * 0.25) / 9);
      const fatCalories = fat * 9;

      const remainingCalories = Math.max(targetCalories - proteinCalories - fatCalories, 400);
      const carbs = Math.round(remainingCalories / 4);

      return { bmr, tdee, surplus: sur, targetCalories, protein, carbs, fat };
    }

    function generateSmartMacroSuggestion(dailyTotals, targets) {
      const proGap = Math.max(0, Math.round((targets.protein - (dailyTotals.protein || 0)) * 10) / 10);
      const carbGap = Math.max(0, Math.round((targets.carbs - (dailyTotals.carbs || 0)) * 10) / 10);
      const calGap = Math.max(0, Math.round(targets.targetCalories - (dailyTotals.calories || 0)));

      if (proGap <= 3 && carbGap <= 8 && calGap <= 80) {
        return {
          isGoalMet: true,
          proGap: 0,
          carbGap: 0,
          calGap: 0,
          title: '🏆 今日增肌營養已完美達標！',
          message: '太猛了！您的蛋白質、碳水化合物與總熱量皆已達標，肌肉正處於最佳合成狀態，好好休息迎接下次訓練！',
          recommendedItem: null
        };
      }

      let picked = SMART_BOOSTER_SNACKS[6]; // 預設：1杯無糖豆漿＋1條中型地瓜

      if (proGap > 5 && carbGap > 15) {
        if (proGap >= 35 && carbGap >= 45 && calGap >= 420) {
          picked = SMART_BOOSTER_SNACKS[10]; // 舒肥雞胸肉便當
        } else if (proGap >= 24 && carbGap >= 40 && calGap >= 400) {
          picked = SMART_BOOSTER_SNACKS[9]; // 火雞肉飯＋1顆茶葉蛋
        } else if (proGap >= 12 && carbGap >= 32) {
          picked = SMART_BOOSTER_SNACKS[6]; // 1杯無糖豆漿＋1條中型地瓜
        } else if (proGap >= 12 && carbGap >= 20 && calGap < 300) {
          picked = SMART_BOOSTER_SNACKS[7]; // 2顆茶葉蛋＋1根香蕉
        } else {
          picked = SMART_BOOSTER_SNACKS[8]; // 鮪魚蛋餅
        }
      } else if (proGap > 3) {
        if (proGap >= 22) {
          picked = SMART_BOOSTER_SNACKS[3]; // 1罐水煮鮪魚罐頭
        } else if (proGap >= 11) {
          picked = calGap <= 155 ? SMART_BOOSTER_SNACKS[2] : SMART_BOOSTER_SNACKS[1]; // 1杯無糖豆漿 或 2顆茶葉蛋
        } else {
          picked = SMART_BOOSTER_SNACKS[0]; // 1顆茶葉蛋
        }
      } else if (carbGap > 8) {
        if (carbGap >= 33) {
          picked = SMART_BOOSTER_SNACKS[5]; // 1條中型地瓜
        } else {
          picked = SMART_BOOSTER_SNACKS[4]; // 1根中型香蕉
        }
      } else {
        picked = SMART_BOOSTER_SNACKS[2]; // 1杯無糖豆漿
      }

      const gapParts = [];
      if (proGap > 0) gapParts.push(`${Math.round(proGap)}g 蛋白質`);
      if (carbGap > 0) gapParts.push(`${Math.round(carbGap)}g 碳水`);
      if (gapParts.length === 0 && calGap > 0) gapParts.push(`${calGap} kcal 熱量`);

      const gapText = gapParts.join('與 ');

      return {
        isGoalMet: false,
        proGap,
        carbGap,
        calGap,
        title: '💡 達標補給建議',
        message: `您還差 ${gapText}，建議可再補充【${picked.name}】即可完美達標！`,
        recommendedItem: picked
      };
    }

    let firebaseInstances = null;
    function initFirebaseClient() {
      if (firebaseInstances) return firebaseInstances;
      const config = getSavedFirebaseConfig();
      if (!config || !config.apiKey || !config.projectId) return null;
      try {
        const app = getApps().length > 0 ? getApp() : initializeApp(config);
        const auth = getAuth(app);
        // 明確要求 Firebase 將登入狀態永久保存在設備的 LocalStorage / IndexedDB 中
        setPersistence(auth, browserLocalPersistence).catch((err) => {
          console.warn('設定 Firebase Auth 持久化失敗:', err);
        });
        const db = getFirestore(app);
        firebaseInstances = { app, auth, db, isCloud: true };
        return firebaseInstances;
      } catch (err) {
        console.warn('Firebase 初始化失敗:', err);
        return null;
      }
    }

    async function saveUserProfile(uid, profileData) {
      const allProfiles = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PROFILES) || '{}');
      const existingProfile = allProfiles[uid] || {};
      allProfiles[uid] = { ...existingProfile, ...profileData, updatedAt: new Date().toISOString() };
      localStorage.setItem(STORAGE_KEYS.LOCAL_PROFILES, JSON.stringify(allProfiles));

      const fb = initFirebaseClient();
      if (fb?.db) {
        const userDocRef = doc(fb.db, 'users', uid);
        await setDoc(userDocRef, { profile: allProfiles[uid], updatedAt: new Date().toISOString() }, { merge: true });
      }
      return allProfiles[uid];
    }

    async function loadUserProfile(uid) {
      const fb = initFirebaseClient();
      if (fb?.db) {
        try {
          const userDocRef = doc(fb.db, 'users', uid);
          const snap = await getDoc(userDocRef);
          if (snap.exists() && snap.data()?.profile) {
            const cloudProfile = snap.data().profile;
            const allProfiles = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PROFILES) || '{}');
            allProfiles[uid] = cloudProfile;
            localStorage.setItem(STORAGE_KEYS.LOCAL_PROFILES, JSON.stringify(allProfiles));
            return cloudProfile;
          }
        } catch (e) {}
      }
      const allProfiles = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PROFILES) || '{}');
      return allProfiles[uid] || null;
    }

          () => {}

      return () => {};

        if (typeof navigator === 'undefined' || !navigator.geolocation) {
          reject(new Error('此裝置或瀏覽器不支援 GPS 定位功能'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              lat: Number(pos.coords.latitude),
              lng: Number(pos.coords.longitude),
              accuracy: Math.round(pos.coords.accuracy || 0)
            });
          },
          (err) => {
            let reason = '無法取得定位';
            if (err.code === 1) reason = '未授權定位權限 (PERMISSION_DENIED)';
            else if (err.code === 2) reason = '無法偵測目前位置 (POSITION_UNAVAILABLE)';
            else if (err.code === 3) reason = '取得定位逾時 (TIMEOUT)';
            const customErr = new Error(reason);
            customErr.code = err.code;
            reject(customErr);
          },
          {
            enableHighAccuracy: true,
            timeout: 7000,
            maximumAge: 15000,
            ...options
          }
        );
      });
    }

    // Haversine 公式：計算兩組經緯度座標之間的球面距離（公尺 m）
    function calculateHaversineDistanceMeters(lat1, lon1, lat2, lon2) {
      if (
        typeof lat1 !== 'number' ||
        typeof lon1 !== 'number' ||
        typeof lat2 !== 'number' ||
        typeof lon2 !== 'number' ||
        Number.isNaN(lat1) ||
        Number.isNaN(lon1) ||
        Number.isNaN(lat2) ||
        Number.isNaN(lon2)
      ) {
        return Infinity;
      }
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // 嚴格設定觸發半徑 <= 20 公尺，由近到遠排序且最多只顯示前 3 筆
    function getNearbyFavoritesWithin20m(
      favorites = [],
      currentCoords = null,
      maxRadiusMeters = 20,
      maxResults = 3
    ) {
      if (!currentCoords || typeof currentCoords.lat !== 'number' || typeof currentCoords.lng !== 'number') {
        return [];
      }
      return favorites
        .filter((fav) => typeof fav.lat === 'number' && typeof fav.lng === 'number')
        .map((fav) => ({
          ...fav,
          distanceMeters: calculateHaversineDistanceMeters(
            currentCoords.lat,
            currentCoords.lng,
            fav.lat,
            fav.lng
          )
        }))
        .filter((fav) => fav.distanceMeters <= maxRadiusMeters)
        .sort((a, b) => a.distanceMeters - b.distanceMeters)
        .slice(0, maxResults);
    }

    function fileToCompressedBase64(file, maxWidth = 1024, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64Data = dataUrl.split(',')[1];
            resolve({ dataUrl, base64Data, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function CalendarPickerModal({
      selectedDate,
      allLogsCache,
      dailyItems,
      targets,
      onSelectDate,
      onClose
    }) {
      const initialDateObj = new Date(selectedDate + 'T00:00:00');
      const [viewYear, setViewYear] = useState(initialDateObj.getFullYear());
      const [viewMonth, setViewMonth] = useState(initialDateObj.getMonth()); // 0 ~ 11

      const todayStr = formatDateKey(new Date());

      const monthCells = useMemo(() => {
        const firstDay = new Date(viewYear, viewMonth, 1);
        const startWeekday = firstDay.getDay(); // 0 (Sun) ~ 6 (Sat)
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

        const cells = [];
        for (let i = 0; i < startWeekday; i++) {
          cells.push(null);
        }
        for (let day = 1; day <= daysInMonth; day++) {
          const d = new Date(viewYear, viewMonth, day);
          const dateStr = formatDateKey(d);
          const logs = dateStr === selectedDate ? dailyItems : allLogsCache[dateStr] || [];
          const totalCal = logs.reduce((s, item) => s + (Number(item.calories) || 0), 0);
          const totalPro = logs.reduce((s, item) => s + (Number(item.protein) || 0), 0);
          cells.push({
            day,
            dateStr,
            isToday: dateStr === todayStr,
            isSelected: dateStr === selectedDate,
            hasLogs: logs.length > 0,
            isGoalMet:
              logs.length > 0 &&
              totalCal >= targets.targetCalories * 0.85 &&
              totalPro >= targets.protein * 0.85
          });
        }
        return cells;
      }, [viewYear, viewMonth, selectedDate, dailyItems, allLogsCache, targets, todayStr]);

      const handlePrevMonth = () => {
        if (viewMonth === 0) {
          setViewYear((y) => y - 1);
          setViewMonth(11);
        } else {
          setViewMonth((m) => m - 1);
        }
      };

      const handleNextMonth = () => {
        if (viewMonth === 11) {
          setViewYear((y) => y + 1);
          setViewMonth(0);
        } else {
          setViewMonth((m) => m + 1);
        }
      };

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-[#0E1525] border border-slate-700 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl"
          >
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-base font-black text-white">📅 選擇飲食紀錄日期</h3>
                <p className="text-xs text-slate-400">點擊任意日期切換並查看當日營養總和</p>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            {/* 月份切換列 */}
            <div className="flex items-center justify-between bg-slate-950 p-2.5 rounded-2xl border border-slate-800">
              <button
                type="button"
                onClick={handlePrevMonth}
                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-extrabold text-slate-200 transition active:scale-95"
              >
                ◀ 上個月
              </button>
              <span className="text-sm font-black text-white">
                {viewYear} 年 {viewMonth + 1} 月
              </span>
              <button
                type="button"
                onClick={handleNextMonth}
                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-extrabold text-slate-200 transition active:scale-95"
              >
                下個月 ▶
              </button>
            </div>

            {/* 星期標題 */}
            <div className="grid grid-cols-7 gap-1 text-center">
              {WEEKDAY_NAMES.map((w) => (
                <div key={w} className="text-[11px] font-bold text-slate-500 py-1">
                  {w}
                </div>
              ))}

              {/* 日期格子 */}
              {monthCells.map((cell, idx) => {
                if (!cell) {
                  return <div key={`empty_${idx}`} className="h-11" />;
                }
                return (

    function DashboardCard({ selectedDate, dailyTotals, targets, onQuickAdd }) {
      const calPercent = Math.min(
        Math.round((dailyTotals.calories / Math.max(targets.targetCalories, 1)) * 100),
        100
      );
      const proPercent = Math.min(
        Math.round((dailyTotals.protein / Math.max(targets.protein, 1)) * 100),
        100
      );
      const carbPercent = Math.min(
        Math.round((dailyTotals.carbs / Math.max(targets.carbs, 1)) * 100),
        100
      );
      const fatPercent = Math.min(
        Math.round((dailyTotals.fat / Math.max(targets.fat, 1)) * 100),
        100
      );

      // 智慧達標建議系統：動態計算當日蛋白質、碳水與熱量缺口並推薦補給食物
      const macroSuggestion = useMemo(
        () => generateSmartMacroSuggestion(dailyTotals, targets),
        [dailyTotals, targets]
      );

      const pCal = dailyTotals.protein * 4;
      const cCal = dailyTotals.carbs * 4;
      const fCal = dailyTotals.fat * 9;
      const macroCalSum = Math.max(pCal + cCal + fCal, 1);

      const pRatio = dailyTotals.calories > 0 ? Math.round((pCal / macroCalSum) * 100) : 0;
      const cRatio = dailyTotals.calories > 0 ? Math.round((cCal / macroCalSum) * 100) : 0;
      const fRatio = dailyTotals.calories > 0 ? Math.max(100 - pRatio - cRatio, 0) : 0;

      const radius = 52;
      const circumference = 2 * Math.PI * radius;
      const pStroke = (pRatio / 100) * circumference;
      const cStroke = (cRatio / 100) * circumference;
      const fStroke = (fRatio / 100) * circumference;

      const remainingCalories = targets.targetCalories - Math.round(dailyTotals.calories);

      return (

                    <circle
                      cx="64"
                      cy="64"
                      r={radius}
                      fill="transparent"
                      stroke="#06B6D4"
                      strokeWidth="14"
                      strokeDasharray={`${pStroke} ${circumference}`}
                      strokeDashoffset={0}
                    />
                    <circle
                      cx="64"
                      cy="64"
                      r={radius}
                      fill="transparent"
                      stroke="#F59E0B"
                      strokeWidth="14"
                      strokeDasharray={`${cStroke} ${circumference}`}
                      strokeDashoffset={-pStroke}
                    />
                    <circle
                      cx="64"
                      cy="64"
                      r={radius}
                      fill="transparent"
                      stroke="#F43F5E"
                      strokeWidth="14"
                      strokeDasharray={`${fStroke} ${circumference}`}

    function AuthView({ isCloudConnected, onOpenCloudSettings, onLoginSuccess, showToast }) {
      const [isRegister, setIsRegister] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [displayName, setDisplayName] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const handleAccountSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          const fb = initFirebaseClient();
          if (fb?.auth) {
            await setPersistence(fb.auth, browserLocalPersistence);
            if (isRegister) {
              const cred = await createUserWithEmailAndPassword(fb.auth, email, password);
              if (displayName.trim()) {
                await updateProfile(cred.user, { displayName: displayName.trim() }).catch(() => {});
              }
              onLoginSuccess({
                uid: cred.user.uid,
                email: cred.user.email,
                displayName: displayName.trim() || cred.user.email.split('@')[0],
                mode: 'firebase'
              });
            } else {
              const cred = await signInWithEmailAndPassword(fb.auth, email, password);
              onLoginSuccess({
                uid: cred.user.uid,
                email: cred.user.email,
                displayName: cred.user.displayName || cred.user.email.split('@')[0],
                mode: 'firebase'
              });
            }
          } else {
            const cleanEmail = email.trim().toLowerCase();
            const uid = 'user_' + btoa(encodeURIComponent(cleanEmail)).replace(/=/g, '');
            onLoginSuccess({
              uid,
              email: cleanEmail,
              displayName: displayName.trim() || cleanEmail.split('@')[0] || '健身者',
              mode: 'local-bound'
            });
          }
        } catch (err) {
          showToast(`登入/註冊失敗：${err.message}`, 'error');
        } finally {
          setSubmitting(false);
        }
      };

      const handleGoogleLogin = async () => {
        const fb = initFirebaseClient();
        if (!fb?.auth) {
          onOpenCloudSettings();
          showToast('請先在設定中貼上 Firebase Config 以啟用 Google 登入，或直接使用下方帳號登入', 'error');
          return;
        }
        try {
          await setPersistence(fb.auth, browserLocalPersistence);
          const provider = new GoogleAuthProvider();
          const cred = await signInWithPopup(fb.auth, provider);
          onLoginSuccess({
            uid: cred.user.uid,
            email: cred.user.email,
            displayName: cred.user.displayName || 'Google 健身會員',
            mode: 'firebase'
          });
        } catch (err) {
          showToast(`Google 登入失敗：${err.message}`, 'error');
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-8">
          <div className="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
            <div className="text-center space-y-2">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-cyan-500 mx-auto flex items-center justify-center text-slate-950 font-black text-2xl shadow-xl shadow-emerald-500/20">
                💪
              </div>
              <h1 className="text-2xl font-black tracking-tight text-white">HYPERBULK 增肌營養追蹤器</h1>
              <p className="text-xs text-slate-400">
                自動計算 BMR & TDEE · Gemini AI 拍照辨識 · 台灣在地飲食快速紀錄
              </p>
            </div>

            <form onSubmit={handleAccountSubmit} className="space-y-3.5">
              {isRegister && (
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">你的健身暱稱</label>
                  <input
                    type="text"
                    value={displayName}
                    onChange={(e) => setDisplayName(e.target.value)}
                    placeholder="例如：阿傑、增肌戰士"
                    className="w-full h-12 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm text-white focus:outline-none focus:border-emerald-400"
                  />
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">電子信箱 (綁定帳號資料)</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="athlete@example.com"
                  className="w-full h-12 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm text-white focus:outline-none focus:border-emerald-400"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-400 mb-1">密碼</label>
                <input
                  type="password"
                  required
                  minLength={6}
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="至少 6 位字元"
                  className="w-full h-12 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm text-white focus:outline-none focus:border-emerald-400"
                />
              </div>

              <button
                type="submit"
                disabled={submitting}
                className="w-full min-h-[52px] rounded-2xl bg-gradient-to-r from-emerald-400 to-cyan-400 text-slate-950 font-black text-sm shadow-lg shadow-emerald-500/25 transition active:scale-95"
              >
                {isRegister ? '建立增肌帳號並開始設定' : '登入增肌追蹤器'}
              </button>
            </form>

            <div className="flex items-center justify-between text-xs">
              <button
                type="button"
                onClick={() => setIsRegister(!isRegister)}
                className="text-emerald-400 font-bold hover:underline"
              >
                {isRegister ? '已有帳號？點此登入' : '首次使用？點此註冊新帳號'}
              </button>

              <button
                type="button"
                onClick={onOpenCloudSettings}
                className="text-slate-400 hover:text-white font-semibold"
              >
                🔑 API / 雲端設定
              </button>
            </div>

            <div className="relative flex py-1 items-center">
              <div className="flex-grow border-t border-slate-800"></div>
              <span className="flex-shrink mx-3 text-[11px] text-slate-500 font-bold">快速登入選項</span>
              <div className="flex-grow border-t border-slate-800"></div>
            </div>

            <div className="grid grid-cols-2 gap-2.5">
              <button
                type="button"
                onClick={handleGoogleLogin}
                className="min-h-[48px] rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs font-bold text-slate-200 flex items-center justify-center gap-2 transition"
              >
                <span>🌐</span> Google 登入
              </button>

              <button
                type="button"
                onClick={() =>
                  onLoginSuccess({
                    uid: 'demo_pro_lifter',
                    email: 'pro@hyperbulk.tw',
                    displayName: '增肌體驗會員',
                    mode: isCloudConnected ? 'firebase' : 'local-bound'
                  })
                }
                className="min-h-[48px] rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/40 text-xs font-extrabold text-emerald-300 flex items-center justify-center gap-1.5 transition"
              >
                <span>⚡</span> 一鍵快速體驗登入
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CloudConfigModal({ user, profile, onClose, onSaved }) {
      const [geminiKey, setGeminiKey] = useState(() => getSavedGeminiKey());
      const [firebaseJson, setFirebaseJson] = useState(() => {
        const cfg = getSavedFirebaseConfig();
        return cfg ? JSON.stringify(cfg, null, 2) : '';
      });
      const [error, setError] = useState('');
      const [saving, setSaving] = useState(false);

      const handleSave = async (e) => {
        e.preventDefault();
        setError('');
        const trimmedKey = (geminiKey || '').trim();
        saveGeminiKey(trimmedKey);
        if (firebaseJson.trim()) {
          try {
            const parsed = JSON.parse(firebaseJson);
            if (!parsed.apiKey || !parsed.projectId) {
              setError('Firebase 設定需包含 apiKey 與 projectId 欄位');
              return;
            }
            saveFirebaseConfig(parsed);
          } catch (err) {
            setError('Firebase Config JSON 格式不正確，請確認為合法 JSON 物件');
            return;
          }
        } else {
          saveFirebaseConfig(null);
        }

        let updatedProfile = null;
        if (user?.uid) {
          setSaving(true);
          try {
            updatedProfile = await saveUserProfile(user.uid, {
              ...(profile || {}),
              geminiKey: trimmedKey
            });
          } catch (err) {
            console.warn('同步 Gemini Key 至雲端失敗:', err);
          } finally {
            setSaving(false);
          }
        }
        onSaved(updatedProfile);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-[#0E1525] border border-slate-700 rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between">
              <h3 className="text-base font-black text-white">🔑 設定 Gemini API 與 Firebase 雲端資料庫</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-emerald-400 mb-1">
                  Gemini API Key (用於 AI 食物拍照辨識)
                </label>
                <input
                  type="password"
                  value={geminiKey}
                  onChange={(e) => setGeminiKey(e.target.value)}
                  placeholder="貼上你的 AIzaSy... Gemini API Key"
                  className="w-full h-11 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs text-white focus:outline-none focus:border-emerald-400"
                />
                <p className="text-[11px] text-slate-400 mt-1">
                  填入後點擊「拍照/選取照片」即可即時呼叫 Gemini 2.5 Flash 辨識食物份量與三大營養素。
                </p>
              </div>

              <div>
                <label className="block text-xs font-bold text-cyan-400 mb-1">
                  Firebase Config JSON (選填，用於跨裝置 Firestore 雲端同步)
                </label>
                <textarea
                  rows={5}
                  value={firebaseJson}
                  onChange={(e) => setFirebaseJson(e.target.value)}
                  placeholder={`{\n  "apiKey": "AIza...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app"\n}`}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-white focus:outline-none focus:border-cyan-400"
                />
              </div>

              {error && <p className="text-xs font-bold text-rose-400">{error}</p>}

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 h-11 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                >
                  取消
                </button>
                <button
                  type="submit"
                  className="flex-1 h-11 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black"
                >
                  儲存設定
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
