    /**
     * BMR, TDEE 與增肌目標營養素計算公式 (Mifflin-St Jeor Equation)
     */
    function calculateBulkingNutrition({
      gender = 'male',
      age = 25,
      height = 175,
      weight = 70,
      activityLevel = 1.55,
      surplus = 350
    }) {
      const w = Number(weight) || 70;
      const h = Number(height) || 175;
      const a = Number(age) || 25;
      const act = Number(activityLevel) || 1.55;
      const sur = Number(surplus) || 350;

      const baseBmr = 10 * w + 6.25 * h - 5 * a + (gender === 'male' ? 5 : -161);
      const bmr = Math.round(baseBmr);
      const tdee = Math.round(baseBmr * act);
      const targetCalories = Math.round(tdee + sur);

      const protein = Math.round(w * 2.0);
      const proteinCalories = protein * 4;

      const fat = Math.round((targetCalories * 0.25) / 9);
      const fatCalories = fat * 9;

      const remainingCalories = Math.max(targetCalories - proteinCalories - fatCalories, 400);
      const carbs = Math.round(remainingCalories / 4);

      return { bmr, tdee, surplus: sur, targetCalories, protein, carbs, fat };
    }

    function generateSmartMacroSuggestion(dailyTotals, targets) {
      const remainingProtein = Math.max(
        0,
        Math.round((targets.protein - (dailyTotals.protein || 0)) * 10) / 10
      );
      const remainingCarbs = Math.max(
        0,
        Math.round((targets.carbs - (dailyTotals.carbs || 0)) * 10) / 10
      );
      const remainingFat = Math.max(

        Math.round((targets.fat - (dailyTotals.fat || 0)) * 10) / 10
      );
      const remainingCal = Math.max(
        0,
        Math.round(targets.targetCalories - (dailyTotals.calories || 0))

          remainingProtein: 0,

    let firebaseInstances = null;
    function initFirebaseClient() {
      if (firebaseInstances) return firebaseInstances;
      const config = getSavedFirebaseConfig();
      if (!config || !config.apiKey || !config.projectId) return null;
      try {
        const app = getApps().length > 0 ? getApp() : initializeApp(config);
        const auth = getAuth(app);
        // 明確要求 Firebase 將登入狀態永久保存在設備的 LocalStorage / IndexedDB 中
        setPersistence(auth, browserLocalPersistence).catch((err) => {
          console.warn('設定 Firebase Auth 持久化失敗:', err);
        });
        const db = getFirestore(app);
        firebaseInstances = { app, auth, db, isCloud: true };
        return firebaseInstances;
      } catch (err) {
        console.warn('Firebase 初始化失敗:', err);
        return null;
      }
    }

    async function saveUserProfile(uid, profileData) {
      const allProfiles = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PROFILES) || '{}');
      const existingProfile = allProfiles[uid] || {};
      allProfiles[uid] = { ...existingProfile, ...profileData, updatedAt: new Date().toISOString() };
      localStorage.setItem(STORAGE_KEYS.LOCAL_PROFILES, JSON.stringify(allProfiles));

      const fb = initFirebaseClient();
      if (fb?.db) {
        const userDocRef = doc(fb.db, 'users', uid);
        await setDoc(userDocRef, { profile: allProfiles[uid], updatedAt: new Date().toISOString() }, { merge: true });
      }
      return allProfiles[uid];
    }

    async function loadUserProfile(uid) {
      const fb = initFirebaseClient();
      if (fb?.db) {
        try {
          const userDocRef = doc(fb.db, 'users', uid);
          const snap = await getDoc(userDocRef);
          if (snap.exists() && snap.data()?.profile) {
            const cloudProfile = snap.data().profile;
            const allProfiles = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PROFILES) || '{}');
            allProfiles[uid] = cloudProfile;
            localStorage.setItem(STORAGE_KEYS.LOCAL_PROFILES, JSON.stringify(allProfiles));
            return cloudProfile;
          }
        } catch (e) {}
      }
      const allProfiles = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_PROFILES) || '{}');
      return allProfiles[uid] || null;
    }

    async function saveDailyMeta(uid, dateStr, metaPatch) {
      const allMeta = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_DAILY_META) || '{}');
      if (!allMeta[uid]) allMeta[uid] = {};
      const current = getDailyMetaLocal(uid, dateStr);
      const nextMeta = {
        ...current,
        ...metaPatch
      };
      allMeta[uid][dateStr] = nextMeta;
      localStorage.setItem(STORAGE_KEYS.LOCAL_DAILY_META, JSON.stringify(allMeta));

      const fb = initFirebaseClient();
      if (fb?.db) {
        try {
          const logDocRef = doc(fb.db, 'users', uid, 'dailyLogs', dateStr);
          await setDoc(
            logDocRef,

              isTrainingDay: nextMeta.isTrainingDay,
              waterMl: nextMeta.waterMl,
              updatedAt: new Date().toISOString()
            },
            { merge: true }
          );
        } catch (e) {
          console.warn('Firestore saveDailyMeta 失敗:', e);
        }
      }
      return nextMeta;
    }

    function subscribeDailyLog(uid, dateStr, callback, onMetaCallback) {
      const localUserLogs = getAllUserLogsLocal(uid);
      callback(localUserLogs[dateStr] || []);
      if (typeof onMetaCallback === 'function') {
        onMetaCallback(getDailyMetaLocal(uid, dateStr));
      }

      const fb = initFirebaseClient();
      if (fb?.db) {
        const logDocRef = doc(fb.db, 'users', uid, 'dailyLogs', dateStr);
        return onSnapshot(
          logDocRef,
          (snap) => {
            if (snap.exists()) {
              const data = snap.data() || {};
              const cloudItems = data.items || [];
              const allLogs = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_LOGS) || '{}');
              if (!allLogs[uid]) allLogs[uid] = {};
              allLogs[uid][dateStr] = cloudItems;
              localStorage.setItem(STORAGE_KEYS.LOCAL_LOGS, JSON.stringify(allLogs));
              callback(cloudItems);

              if (typeof data.isTrainingDay === 'boolean' || typeof data.waterMl === 'number') {
                const allMeta = JSON.parse(localStorage.getItem(STORAGE_KEYS.LOCAL_DAILY_META) || '{}');
                if (!allMeta[uid]) allMeta[uid] = {};

    function getCurrentGpsPosition(options = {}) {
      return new Promise((resolve, reject) => {
        if (typeof navigator === 'undefined' || !navigator.geolocation) {
          reject(new Error('此裝置或瀏覽器不支援 GPS 定位功能'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              lat: Number(pos.coords.latitude),
              lng: Number(pos.coords.longitude),
              accuracy: Math.round(pos.coords.accuracy || 0)
            });
          },
          (err) => {
            let reason = '無法取得定位';
            if (err.code === 1) reason = '未授權定位權限 (PERMISSION_DENIED)';
            else if (err.code === 2) reason = '無法偵測目前位置 (POSITION_UNAVAILABLE)';
            else if (err.code === 3) reason = '取得定位逾時 (TIMEOUT)';
            const customErr = new Error(reason);
            customErr.code = err.code;
            reject(customErr);
          },
          {
            enableHighAccuracy: true,
            timeout: 7000,
            maximumAge: 15000,
            ...options
          }
        );
      });
    }

    // Haversine 公式：計算兩組經緯度座標之間的球面距離（公尺 m）
    function calculateHaversineDistanceMeters(lat1, lon1, lat2, lon2) {
      if (
        typeof lat1 !== 'number' ||
        typeof lon1 !== 'number' ||
        typeof lat2 !== 'number' ||
        typeof lon2 !== 'number' ||
        Number.isNaN(lat1) ||
        Number.isNaN(lon1) ||
        Number.isNaN(lat2) ||
        Number.isNaN(lon2)
      ) {
        return Infinity;
      }
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // 嚴格設定觸發半徑 <= 20 公尺，由近到遠排序且最多只顯示前 3 筆
    function getNearbyFavoritesWithin20m(
      favorites = [],
      currentCoords = null,
      maxRadiusMeters = 20,
      maxResults = 3
    ) {
      if (!currentCoords || typeof currentCoords.lat !== 'number' || typeof currentCoords.lng !== 'number') {
        return [];
      }
      return favorites
        .filter((fav) => typeof fav.lat === 'number' && typeof fav.lng === 'number')
        .map((fav) => ({
          ...fav,
          distanceMeters: calculateHaversineDistanceMeters(
            currentCoords.lat,
            currentCoords.lng,
            fav.lat,
            fav.lng
          )
        }))
        .filter((fav) => fav.distanceMeters <= maxRadiusMeters)
        .sort((a, b) => a.distanceMeters - b.distanceMeters)
        .slice(0, maxResults);
    }

    function fileToCompressedBase64(file, maxWidth = 1024, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64Data = dataUrl.split(',')[1];
            resolve({ dataUrl, base64Data, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      const refreshGpsLocation = async (silent = true) => {

          setGpsStatus(err.code === 1 ? 'denied' : 'error');

      // Haversine 距離 <= 20 公尺，由近到遠排序且最多顯示前 3 筆
      const nearbyFavorites = useMemo(() => {

      const dailyTotals = useMemo(() => {
        return dailyItems.reduce(

            acc.carbs += Number(item.carbs) || 0;
            acc.fat += Number(item.fat) || 0;

          { calories: 0, protein: 0, carbs: 0, fat: 0 }

      }, [dailyItems]);

      const baseTargets = useMemo(() => {
        if (profile?.targets) return profile.targets;
        return calculateBulkingNutrition({
          gender: 'male',
          age: 25,

          activityLevel: 1.55,

        });

      // 動態 TDEE 與營養目標：切換至「休息日」時，自動將當日目標熱量下調 300 kcal，並主要從碳水化合物扣除 (-75g)
      const targets = useMemo(() => {
        if (dailyMeta.isTrainingDay) {
          return {
            ...baseTargets,
            isTrainingDay: true
          };
        }
        const restCalories = Math.max(1200, baseTargets.targetCalories - 300);
        const restCarbs = Math.max(50, baseTargets.carbs - 75);
        return {
          ...baseTargets,
          targetCalories: restCalories,
          carbs: restCarbs,
          isTrainingDay: false
        };
      }, [baseTargets, dailyMeta.isTrainingDay]);

      const calendarDays = useMemo(() => {
        const center = new Date(selectedDate + 'T00:00:00');
        const days = [];
        for (let offset = -10; offset <= 10; offset++) {
          const d = new Date(center);
          d.setDate(center.getDate() + offset);
          const dateStr = formatDateKey(d);
          const dayLogs = dateStr === selectedDate ? dailyItems : allLogsCache[dateStr] || [];
          const totalCal = dayLogs.reduce((sum, i) => sum + (Number(i.calories) || 0), 0);
          const totalPro = dayLogs.reduce((sum, i) => sum + (Number(i.protein) || 0), 0);
          days.push({
            dateStr,
            dayNumber: d.getDate(),
            weekday: WEEKDAY_NAMES[d.getDay()],
            isToday: dateStr === formatDateKey(new Date()),
            hasLogs: dayLogs.length > 0,
            isGoalMet:
              dayLogs.length > 0 &&
              totalCal >= targets.targetCalories * 0.85 &&
              totalPro >= targets.protein * 0.85
          });
        }
        return days;
      }, [selectedDate, dailyItems, allLogsCache, targets]);

      // 彙整使用者所有日期的歷史飲食紀錄，供 Step 1 歷史店家與 Step 2「📜 過去在此點過的餐點」比對
      const allHistoricalLogsFlat = useMemo(() => {
        const list = [];
        const mergedMap = { ...(allLogsCache || {}), [selectedDate]: dailyItems };
        Object.entries(mergedMap).forEach(([dateKey, items]) => {
          if (Array.isArray(items)) {
            items.forEach((it) => {
              if (it && (it.foodName || it.name)) {
                list.push({ ...it, dateKey });
              }
            });
          }
        });
        return list;
      }, [allLogsCache, dailyItems, selectedDate]);

      // Step 2：嚴格比對該地點（mode === 'place' 僅比對 placeId 或 店名，僅在 custom_gps 時啟用 25m 內座標比對）
      const placeHistoryItems = useMemo(() => {
        if (!selectedPlace || selectedPlace.mode === 'none') return [];
        const matchedMap = new Map();
        const combinedSource = [
          ...allHistoricalLogsFlat,
          ...(favorites || []).map((f) => ({ ...f, dateKey: '常吃收藏' }))
        ];

        for (const item of combinedSource) {
          if (!item || !(item.foodName || item.name)) continue;
          let isMatch = false;

          if (
            selectedPlace.placeId &&
            item.placeId &&
            selectedPlace.placeId === item.placeId
          ) {
            isMatch = true;
          } else if (
            selectedPlace.placeName &&
            item.placeName &&
            selectedPlace.placeName.trim() === item.placeName.trim()
          ) {
            isMatch = true;
          } else if (
            selectedPlace.mode === 'custom_gps' &&
            selectedPlace.lat != null &&
            selectedPlace.lng != null &&
            item.lat != null &&
            item.lng != null
          ) {
            const dist = calculateHaversineDistanceMeters(
              Number(selectedPlace.lat),
              Number(selectedPlace.lng),
              Number(item.lat),
              Number(item.lng)
            );
            if (dist <= 25) {
              isMatch = true;
            }
          }

          if (isMatch) {
            const fName = (item.foodName || item.name).trim();
            const key = `${fName}_${Math.round(Number(item.calories) || 0)}`;
            if (!matchedMap.has(key)) {
              matchedMap.set(key, {
                id: item.id || key,
                foodName: fName,
                portion: item.portion || '1份',
                calories: Math.round(Number(item.calories) || 0),
                protein: Number((Number(item.protein) || 0).toFixed(1)),
                carbs: Number((Number(item.carbs) || 0).toFixed(1)),
                fat: Number((Number(item.fat) || 0).toFixed(1)),
                placeId: item.placeId || selectedPlace.placeId || null,
                placeName: item.placeName || selectedPlace.placeName || '',
                lat: item.lat ?? selectedPlace.lat ?? null,
                lng: item.lng ?? selectedPlace.lng ?? null,
                dateKey: item.dateKey || ''
              });
            }
          }
        }
        return Array.from(matchedMap.values());
      }, [selectedPlace, allHistoricalLogsFlat, favorites]);

      // Step 1 選擇地點後進入 Step 2

          lng: placeObj.lng ?? null

        setFormState((prev) => ({

      const handleStartEditRecord = (item) => {

          });

          return;

            });

            showToast(`✨ Gemini 文字估算完成：${result.foodName}`);

            showToast(
              `✨ AI 已估算「${fallbackResult.foodName}」並帶入下方表單！（設定 Gemini API Key 可啟用雲端即時推論）`
            );

      // 支援 iOS 捷徑的三合一網址路由 (URL Action Routing: ?action=camera | ?action=presets | ?food=...)
      useEffect(() => {
        if (authLoading || !user) return;
        if (typeof window === 'undefined') return;

        const params = new URLSearchParams(window.location.search);
        const actionParam = params.get('action');
        const foodParam = params.get('food');

        if (!actionParam && !foodParam) return;

        // 執行路由切換後，清除網址參數保持乾淨
        const cleanUrl =
          window.location.pathname + (window.location.hash ? window.location.hash : '');

        } else if (actionParam === 'presets') {

        } else if (foodParam && foodParam.trim()) {

      const handleSaveAsFavorite = async (item) => {

        const firstDay = new Date(viewYear, viewMonth, 1);
        const startWeekday = firstDay.getDay(); // 0 (Sun) ~ 6 (Sat)
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

        const cells = [];
        for (let i = 0; i < startWeekday; i++) {
          cells.push(null);
        }
        for (let day = 1; day <= daysInMonth; day++) {
          const d = new Date(viewYear, viewMonth, day);
          const dateStr = formatDateKey(d);
          const logs = dateStr === selectedDate ? dailyItems : allLogsCache[dateStr] || [];
          const totalCal = logs.reduce((s, item) => s + (Number(item.calories) || 0), 0);
          const totalPro = logs.reduce((s, item) => s + (Number(item.protein) || 0), 0);
          cells.push({
            day,
            dateStr,
            isToday: dateStr === todayStr,
            isSelected: dateStr === selectedDate,
            hasLogs: logs.length > 0,
            isGoalMet:
              logs.length > 0 &&
              totalCal >= targets.targetCalories * 0.85 &&
              totalPro >= targets.protein * 0.85
          });
        }
        return cells;
      }, [viewYear, viewMonth, selectedDate, dailyItems, allLogsCache, targets, todayStr]);

      const handlePrevMonth = () => {
        if (viewMonth === 0) {
          setViewYear((y) => y - 1);
          setViewMonth(11);
        } else {
          setViewMonth((m) => m - 1);
        }
      };

      const handleNextMonth = () => {
        if (viewMonth === 11) {
          setViewYear((y) => y + 1);
          setViewMonth(0);
        } else {
          setViewMonth((m) => m + 1);
        }
      };

      return (
        <div
          onClick={onClose}
          className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-[#0E1525] border border-slate-700 rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl"
          >
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-base font-black text-white">📅 選擇飲食紀錄日期</h3>
                <p className="text-xs text-slate-400">點擊任意日期切換並查看當日營養總和</p>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            {/* 月份切換列 */}
            <div className="flex items-center justify-between bg-slate-950 p-2.5 rounded-2xl border border-slate-800">
              <button
                type="button"
                onClick={handlePrevMonth}
                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-extrabold text-slate-200 transition active:scale-95"
              >
                ◀ 上個月
              </button>
              <span className="text-sm font-black text-white">
                {viewYear} 年 {viewMonth + 1} 月
              </span>
              <button
                type="button"
                onClick={handleNextMonth}
                className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-extrabold text-slate-200 transition active:scale-95"
              >
                下個月 ▶
              </button>
            </div>

            {/* 星期標題 */}
            <div className="grid grid-cols-7 gap-1 text-center">
              {WEEKDAY_NAMES.map((w) => (
                <div key={w} className="text-[11px] font-bold text-slate-500 py-1">
                  {w}
                </div>
              ))}

              {/* 日期格子 */}
              {monthCells.map((cell, idx) => {
                if (!cell) {
                  return <div key={`empty_${idx}`} className="h-11" />;
                }
                return (
                  <button
                    key={cell.dateStr}
                    type="button"
                    onClick={() => onSelectDate(cell.dateStr)}
                    className={`h-11 rounded-xl flex flex-col items-center justify-center border transition active:scale-95 ${
                      cell.isSelected
                        ? 'bg-emerald-500 text-slate-950 border-emerald-300 font-black shadow-lg shadow-emerald-500/25'
                        : cell.isToday
                        ? 'bg-slate-800 text-emerald-300 border-emerald-500/50 font-extrabold'
                        : 'bg-slate-950/70 hover:bg-slate-800/80 text-slate-200 border-slate-800/70 font-bold'
                    }`}
                  >
                    <span className="text-xs leading-none">{cell.day}</span>
                    <div className="mt-1 h-1.5 flex items-center justify-center">
                      {cell.hasLogs && (
                        <span
                          className={`w-1.5 h-1.5 rounded-full ${
                            cell.isSelected
                              ? 'bg-slate-950'
                              : cell.isGoalMet
                              ? 'bg-emerald-400'
                              : 'bg-amber-400'
                          }`}
                        />
                      )}
                    </div>
                  </button>
                );
              })}
            </div>

            {/* 圖例與快速跳回今天 */}
            <div className="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
              <div className="flex items-center gap-3 text-[11px] text-slate-400">
                <span className="flex items-center gap-1">
                  <i className="w-2 h-2 rounded-full bg-emerald-400 inline-block" /> 增肌達標
                </span>
                <span className="flex items-center gap-1">
                  <i className="w-2 h-2 rounded-full bg-amber-400 inline-block" /> 有紀錄
                </span>
              </div>
              <button
                type="button"
                onClick={() => onSelectDate(todayStr)}
                className="px-3.5 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 font-extrabold transition"
              >
                跳回今天 ({todayStr})
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DashboardCard({
      selectedDate,
      dailyTotals,
      targets,
      isTrainingDay = false,
      onToggleTrainingDay,
      waterMl = 0,
      onAddWater,
      userWeight = 70,
      onQuickAdd
    }) {
      const calPercent = Math.min(
        Math.round((dailyTotals.calories / Math.max(targets.targetCalories, 1)) * 100),
        100
      );
      const proPercent = Math.min(
        Math.round((dailyTotals.protein / Math.max(targets.protein, 1)) * 100),
        100
      );
      const carbPercent = Math.min(
        Math.round((dailyTotals.carbs / Math.max(targets.carbs, 1)) * 100),
        100
      );
      const fatPercent = Math.min(
        Math.round((dailyTotals.fat / Math.max(targets.fat, 1)) * 100),
        100
      );

      // 2. 客製化 900ml 保溫杯水分追蹤計算：體重 × 40ml + (訓練日 +1000ml)
      const baseWaterMl = Math.round((Number(userWeight) || 70) * 40);
      const targetWaterMl = baseWaterMl + (isTrainingDay ? 1000 : 0);
      const targetBottles = (targetWaterMl / 900).toFixed(1);
      const currentBottles = (waterMl / 900).toFixed(1);
      const waterPercent = Math.min(
        Math.round((waterMl / Math.max(targetWaterMl, 1)) * 100),
        100
      );

      // 4. 台灣超商版「智慧達標補給建議」
      const macroSuggestion = useMemo(
        () => generateSmartMacroSuggestion(dailyTotals, targets),
        [dailyTotals, targets]
      );

      const pCal = dailyTotals.protein * 4;
      const cCal = dailyTotals.carbs * 4;
      const fCal = dailyTotals.fat * 9;
      const macroCalSum = Math.max(pCal + cCal + fCal, 1);

      const pRatio = dailyTotals.calories > 0 ? Math.round((pCal / macroCalSum) * 100) : 0;
      const cRatio = dailyTotals.calories > 0 ? Math.round((cCal / macroCalSum) * 100) : 0;
      const fRatio = dailyTotals.calories > 0 ? Math.max(100 - pRatio - cRatio, 0) : 0;

      const radius = 52;
      const circumference = 2 * Math.PI * radius;
      const pStroke = (pRatio / 100) * circumference;
      const cStroke = (cRatio / 100) * circumference;
      const fStroke = (fRatio / 100) * circumference;

      const remainingCalories = targets.targetCalories - Math.round(dailyTotals.calories);

      return (
        <section className="bg-gradient-to-b from-slate-900 to-[#0B1220] border border-slate-800/90 rounded-3xl p-4 shadow-2xl space-y-4">
          {/* 1. 訓練日 / 休息日動態目標切換開關 (綁定 selectedDate 並同步雲端) */}
          <div className="bg-slate-950/90 p-2 rounded-2xl border border-slate-800 space-y-1.5">
            <div className="grid grid-cols-2 gap-2">
              <button
                type="button"
                onClick={() => onToggleTrainingDay && onToggleTrainingDay(true)}
                className={`py-2.5 px-3 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 ${
                  isTrainingDay
                    ? 'bg-gradient-to-r from-emerald-400 to-cyan-400 text-slate-950 shadow-md shadow-emerald-500/20'
                    : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'
                }`}
              >
                <span>💪 今日有訓練 (約2小時)</span>
              </button>
              <button
                type="button"
                onClick={() => onToggleTrainingDay && onToggleTrainingDay(false)}
                className={`py-2.5 px-3 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 ${
                  !isTrainingDay
                    ? 'bg-gradient-to-r from-indigo-400 to-cyan-400 text-slate-950 shadow-md shadow-indigo-500/20'
                    : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'
                }`}
              >
                <span>🛌 今日休息 (-300 kcal)</span>
              </button>
            </div>
            <p className="text-[11px] text-center font-semibold text-slate-400">
              {isTrainingDay
                ? '🔥 訓練日模式：維持完整增肌熱量與高碳水，支援高強度重訓與肝醣回補'
                : '🛌 休息日模式：自動下調 300 kcal（從碳水扣除 75g），維持高蛋白並減少非必要碳水囤積'}
            </p>
          </div>

          <div className="grid grid-cols-3 gap-2 bg-slate-950/90 p-2.5 rounded-2xl border border-slate-800/80 text-center">
            <div>
              <span className="text-[10px] font-bold text-slate-400 block">BMR 基礎代謝</span>
              <span className="text-sm font-black text-slate-200">{targets.bmr}</span>
              <span className="text-[10px] text-slate-500 ml-0.5">kcal</span>
            </div>
            <div className="border-x border-slate-800">
              <span className="text-[10px] font-bold text-slate-400 block">
                {isTrainingDay ? 'TDEE 訓練消耗' : 'TDEE 休息日調整'}
              </span>
              <span className="text-sm font-black text-cyan-400">{targets.tdee}</span>
              <span className="text-[10px] text-slate-500 ml-0.5">kcal</span>
            </div>
            <div>
              <span className="text-[10px] font-bold text-emerald-400 block">
                {isTrainingDay ? `增肌目標 (+${targets.surplus})` : '休息日目標 (-300)'}
              </span>
              <span className="text-sm font-black text-emerald-400">{targets.targetCalories}</span>
              <span className="text-[10px] text-slate-500 ml-0.5">kcal</span>
            </div>
          </div>

          <div className="flex items-center gap-4">
            <div className="relative w-32 h-32 flex-shrink-0 flex items-center justify-center">
              <svg className="w-32 h-32 -rotate-90" viewBox="0 0 128 128">
                <circle cx="64" cy="64" r={radius} fill="transparent" stroke="#1E293B" strokeWidth="14" />
                {dailyTotals.calories > 0 && (
                  <>
                    <circle
                      cx="64"
                      cy="64"
                      r={radius}
                      fill="transparent"
                      stroke="#06B6D4"
                      strokeWidth="14"
                      strokeDasharray={`${pStroke} ${circumference}`}
                      strokeDashoffset={0}
                    />
                    <circle
                      cx="64"
                      cy="64"
                      r={radius}
                      fill="transparent"
                      stroke="#F59E0B"
                      strokeWidth="14"
                      strokeDasharray={`${cStroke} ${circumference}`}
                      strokeDashoffset={-pStroke}
                    />
                    <circle
                      cx="64"
                      cy="64"
                      r={radius}
                      fill="transparent"
                      stroke="#F43F5E"
                      strokeWidth="14"
                      strokeDasharray={`${fStroke} ${circumference}`}
                      strokeDashoffset={-(pStroke + cStroke)}
                    />
                  </>
                )}
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span className="text-[10px] font-bold text-slate-400">熱量達標率</span>
                <span className="text-xl font-black text-white">{calPercent}%</span>
                <span className="text-[10px] font-bold text-emerald-400">
                  {Math.round(dailyTotals.calories)} kcal
                </span>
              </div>
            </div>

            <div className="flex-1 space-y-2.5">
              <div>
                <div className="flex items-center justify-between text-xs">
                  <span className="font-bold text-slate-400">{selectedDate} 熱量進度</span>
                  <span className={`font-extrabold ${remainingCalories >= 0 ? 'text-emerald-400' : 'text-amber-400'}`}>
                    {remainingCalories >= 0
                      ? `還需 ${remainingCalories} kcal`
                      : `超標 ${Math.abs(remainingCalories)} kcal`}
                  </span>
                </div>
                <div className="w-full h-3 bg-slate-950 rounded-full overflow-hidden mt-1 border border-slate-800">
                  <div
                    className="h-full bg-gradient-to-r from-emerald-500 to-lime-400 rounded-full transition-all duration-500"
                    style={{ width: `${calPercent}%` }}
                  />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-1.5 pt-1">
                <div className="bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 text-center">
                  <span className="text-[10px] text-cyan-400 font-bold block">● 蛋白質佔比</span>
                  <span className="text-xs font-black text-white">{pRatio}%</span>
                </div>
                <div className="bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 text-center">
                  <span className="text-[10px] text-amber-400 font-bold block">● 碳水佔比</span>
                  <span className="text-xs font-black text-white">{cRatio}%</span>
                </div>
                <div className="bg-slate-950/80 border border-slate-800/80 rounded-xl p-2 text-center">
                  <span className="text-[10px] text-rose-400 font-bold block">● 脂肪佔比</span>
                  <span className="text-xs font-black text-white">{fRatio}%</span>
                </div>
              </div>
            </div>
          </div>

          <div className="space-y-3 pt-2 border-t border-slate-800/80">
            <div>
              <div className="flex justify-between items-center text-xs mb-1">
                <span className="font-extrabold text-cyan-400">🥩 蛋白質 (Protein)</span>
                <span className="font-bold text-slate-300">
                  <strong className="text-white">{dailyTotals.protein.toFixed(1)}</strong> / {targets.protein} g ({proPercent}%)
                </span>
              </div>
              <div className="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                <div
                  className="h-full bg-gradient-to-r from-cyan-500 to-sky-400 rounded-full transition-all duration-500"
                  style={{ width: `${proPercent}%` }}
                />
              </div>
            </div>

            <div>
              <div className="flex justify-between items-center text-xs mb-1">
                <span className="font-extrabold text-amber-400">
                  🍚 碳水化合物 (Carbs) {!isTrainingDay && '· 休息日減碳'}
                </span>
                <span className="font-bold text-slate-300">
                  <strong className="text-white">{dailyTotals.carbs.toFixed(1)}</strong> / {targets.carbs} g ({carbPercent}%)
                </span>
              </div>
              <div className="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                <div
                  className="h-full bg-gradient-to-r from-amber-500 to-yellow-400 rounded-full transition-all duration-500"
                  style={{ width: `${carbPercent}%` }}
                />
              </div>
            </div>

            <div>
              <div className="flex justify-between items-center text-xs mb-1">
                <span className="font-extrabold text-rose-400">🥑 脂肪 (Fat)</span>
                <span className="font-bold text-slate-300">
                  <strong className="text-white">{dailyTotals.fat.toFixed(1)}</strong> / {targets.fat} g ({fatPercent}%)
                </span>
              </div>
              <div className="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                <div
                  className="h-full bg-gradient-to-r from-rose-500 to-pink-400 rounded-full transition-all duration-500"
                  style={{ width: `${fatPercent}%` }}
                />
              </div>
            </div>
          </div>

          {/* 2. 💧 客製化 900ml 保溫杯水分追蹤系統 */}
          <div className="bg-slate-950/90 border border-sky-500/30 rounded-2xl p-3.5 space-y-2.5">
            <div className="flex items-start justify-between gap-2">
              <div>
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-xs font-black text-sky-300">
                    💧 水分追蹤（900ml 保溫杯專屬換算）
                  </span>
                  {waterPercent >= 100 && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/40 font-black">
                      🎉 今日喝水達標！
                    </span>
                  )}
                </div>
                <p className="text-[11px] text-slate-300 font-semibold mt-0.5">
                  今天目標是喝完{' '}
                  <strong className="text-sky-300 text-xs font-black">{targetBottles} 瓶</strong>{' '}
                  保溫杯（共 {targetWaterMl} ml
                  {isTrainingDay ? `，含訓練流失 +1000ml` : `，基礎體重×40ml`}）
                </p>
              </div>
              <div className="text-right">
                <span className="text-sm font-black text-sky-400">{currentBottles}</span>
                <span className="text-[11px] text-slate-400"> / {targetBottles} 瓶</span>
                <span className="block text-[10px] text-slate-500">
                  ({waterMl} / {targetWaterMl} ml)
                </span>
              </div>
            </div>

            <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
              <div
                className="h-full bg-gradient-to-r from-sky-500 via-cyan-400 to-emerald-400 rounded-full transition-all duration-500"
                style={{ width: `${waterPercent}%` }}
              />
            </div>

            <div className="flex items-center gap-2 pt-0.5">
              <button
                type="button"
                onClick={() => onAddWater && onAddWater(900)}
                className="flex-1 py-2 px-3 rounded-xl bg-gradient-to-r from-sky-500 to-cyan-400 hover:from-sky-400 hover:to-cyan-300 text-slate-950 text-xs font-black shadow-md shadow-sky-500/20 transition active:scale-95"
              >
                ＋喝滿 1 瓶 (900ml)
              </button>
              <button
                type="button"
                onClick={() => onAddWater && onAddWater(450)}
                className="flex-1 py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-300 border border-sky-500/30 text-xs font-extrabold transition active:scale-95"
              >
                ＋喝半瓶 (450ml)
              </button>
              {waterMl > 0 && (
                <button
                  type="button"
                  onClick={() => onAddWater && onAddWater(-450)}
                  title="扣減 450ml"
                  className="py-2 px-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-rose-300 border border-slate-800 text-[11px] font-bold transition"
                >
                  -450
                </button>
              )}
            </div>
          </div>

          {/* 4. 💡 台灣超商版「智慧達標補給建議」區塊 */}
          <div
            className={`rounded-2xl p-3.5 border transition-all ${
              macroSuggestion.isGoalMet
                ? 'bg-gradient-to-r from-emerald-950/70 via-emerald-900/30 to-cyan-950/60 border-emerald-400/50 shadow-lg shadow-emerald-500/10'
                : 'bg-gradient-to-r from-amber-950/40 via-slate-950/90 to-emerald-950/40 border-amber-500/40 shadow-lg shadow-amber-500/5'
            }`}
          >
            <div className="space-y-2.5">
              <div className="space-y-1">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span
                    className={`text-xs font-black tracking-wide ${
                      macroSuggestion.isGoalMet ? 'text-emerald-300' : 'text-amber-300'
                    }`}
                  >
                    {macroSuggestion.title}
                  </span>
                  {!macroSuggestion.isGoalMet && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-900/90 text-amber-300 border border-amber-500/30 font-extrabold">
                      缺口：P {macroSuggestion.remainingProtein}g · C{' '}
                      {macroSuggestion.remainingCarbs}g · F {macroSuggestion.remainingFat}g
                    </span>
                  )}
                </div>
                <p className="text-xs text-slate-200 leading-relaxed font-semibold">
                  {macroSuggestion.message}
                </p>
              </div>

              {!macroSuggestion.isGoalMet &&
                Array.isArray(macroSuggestion.recommendations) &&
                macroSuggestion.recommendations.length > 0 &&
                typeof onQuickAdd === 'function' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                    {macroSuggestion.recommendations.map((recItem) => (
                      <div
                        key={recItem.id}
                        className="bg-slate-950/85 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between gap-2"
                      >
                        <div className="min-w-0">
                          <p className="text-xs font-extrabold text-white truncate">
                            {recItem.name}
                          </p>
                          <p className="text-[10px] text-emerald-300 font-bold">
                            +{recItem.protein}g P · +{recItem.carbs}g C · +{recItem.fat}g F ({recItem.calories} kcal)
                          </p>
                        </div>
                        <button
                          type="button"
                          onClick={() => onQuickAdd(recItem)}
                          className="flex-shrink-0 px-3 py-1.5 rounded-lg bg-gradient-to-r from-emerald-400 to-cyan-400 hover:from-emerald-300 hover:to-cyan-300 text-slate-950 text-[11px] font-black shadow-sm transition active:scale-95"
                        >
                          ＋紀錄
                        </button>
                      </div>
                    ))}
                  </div>
                )}
            </div>
          </div>

          {/* 1. 訓練日前後補給專屬提示框（僅在「今日有訓練」時顯示） */}
          {isTrainingDay && (
            <div className="bg-gradient-to-br from-emerald-950/50 via-slate-950/90 to-cyan-950/50 border border-emerald-500/35 rounded-2xl p-3.5 space-y-2">
              <div className="flex items-center gap-1.5">
                <span className="text-xs font-black text-emerald-300">
                  ⚡ 訓練日專屬前後補給攻略（把握合成視窗）
                </span>

    /**
     * 動態載入 Google Maps JavaScript API (支援最新 Places API (New), v=beta)
     */
    let googleMapsScriptPromise = null;
    let loadedMapsApiKey = '';

    function loadGoogleMapsApi(apiKey) {
      const cleanKey = (apiKey || '').trim();
      if (!cleanKey) {
        return Promise.reject(new Error('尚未設定 Google Maps API Key'));
      }
      if (
        window.google &&
        window.google.maps &&
        typeof window.google.maps.importLibrary === 'function' &&
        loadedMapsApiKey === cleanKey
      ) {
        return Promise.resolve(window.google.maps);
      }
      if (googleMapsScriptPromise && loadedMapsApiKey === cleanKey) {
        return googleMapsScriptPromise;
      }

      loadedMapsApiKey = cleanKey;
      googleMapsScriptPromise = new Promise((resolve, reject) => {
        const existingScript = document.getElementById('hyperbulk-google-maps-script');
        if (existingScript) {
          existingScript.remove();
        }
        const script = document.createElement('script');
        script.id = 'hyperbulk-google-maps-script';
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(cleanKey)}&v=beta&libraries=places&language=zh-TW`;
        script.async = true;
        script.defer = true;
        script.onload = () => {
          if (window.google && window.google.maps) {
            resolve(window.google.maps);
          } else {
            googleMapsScriptPromise = null;
            reject(new Error('Google Maps SDK 載入失敗'));
          }
        };
        script.onerror = () => {
          googleMapsScriptPromise = null;
          reject(new Error('無法連線載入 Google Maps API，請檢查金鑰與網路狀態'));
        };
        document.head.appendChild(script);
      });

      return googleMapsScriptPromise;
    }

    /**
     * 解析新版 Places API (New) 的 Place 實例屬性
     * (place.id, place.displayName, place.formattedAddress, place.location.lat()/lng())
     */
    function parseNewPlaceObject(place, centerPos = null) {
      if (!place) return null;
      const lat =
        typeof place.location?.lat === 'function'
          ? place.location.lat()
          : typeof place.location?.lat === 'number'
            ? place.location.lat
            : null;
      const lng =
        typeof place.location?.lng === 'function'
          ? place.location.lng()
          : typeof place.location?.lng === 'number'
            ? place.location.lng
            : null;
      const displayName =
        typeof place.displayName === 'object' && place.displayName !== null
          ? place.displayName.text || ''
          : place.displayName || place.name || '未知店家';
      const formattedAddress =
        place.formattedAddress || place.shortFormattedAddress || '';
      const dist =
        lat != null && lng != null && centerPos && centerPos.lat != null && centerPos.lng != null
          ? Math.round(
              calculateHaversineDistanceMeters(
                Number(centerPos.lat),
                Number(centerPos.lng),
                Number(lat),
                Number(lng)
              )
            )
          : null;

      return {
        placeId: place.id || `place_${displayName}`,
        placeName: displayName,
        address: formattedAddress,
        lat,
        lng,
        distanceM: dist,
        rating: place.rating || null
      };
    }

            placeId: 'tw_breakfast',
            placeName: '傳統早餐店 / 早午餐',
            address: '早餐外食 · 鮪魚蛋餅 / 里肌豬排吐司 / 無糖豆漿'
          },
          {
            placeId: 'tw_noodle',
            placeName: '牛肉麵 / 水餃小吃店',
            address: '中式麵食 · 紅燒牛肉麵 / 水餃 / 滷味拼盤'
          }
        ];

        for (const d of defaults) {
          if (!mapByKey.has(d.placeId) && !mapByKey.has(d.placeName)) {
            mapByKey.set(d.placeId, {
              ...d,
              lat: currentCoords?.lat ?? null,
              lng: currentCoords?.lng ?? null,
              isHistory: false,
              distanceM: null
            });
          }
        }

        return Array.from(mapByKey.values()).sort((a, b) => {
          if (a.distanceM != null && b.distanceM != null) return a.distanceM - b.distanceM;
          if (a.isHistory && !b.isHistory) return -1;
          if (!a.isHistory && b.isHistory) return 1;
          return 0;
        });
      }, [allHistoricalLogsFlat, favorites, currentCoords]);

      const clearMapMarkers = () => {
        markersRef.current.forEach((m) => m.setMap && m.setMap(null));
        markersRef.current = [];
      };

      const renderPlaceMarkers = (placesList, gmaps, map) => {
        clearMapMarkers();
        if (!gmaps || !map || !Array.isArray(placesList)) return;

        placesList.forEach((p) => {
          if (p.lat == null || p.lng == null) return;
          const marker = new gmaps.Marker({
            position: { lat: Number(p.lat), lng: Number(p.lng) },
            map,
            title: p.placeName
          });
          marker.addListener('click', () => {
            onSelectPlace({
              mode: 'place',
              placeId: p.placeId,
              placeName: p.placeName,
              address: p.address || '',
              lat: Number(p.lat),
              lng: Number(p.lng)
            });
          });
          markersRef.current.push(marker);
        });
      };

      // 使用新版 Places API (New): Place.searchNearby() 搜尋附近餐廳
      const fetchNearbyFoodPlaces = async (gmaps, map, centerPos) => {
        if (!gmaps || !map) return;
        setSearchingPlaces(true);
        try {
          const { Place, SearchNearbyRankPreference } = await gmaps.importLibrary('places');
          const request = {
            fields: ['id', 'displayName', 'formattedAddress', 'location', 'rating'],
            locationRestriction: {
              center: {
                lat: Number(centerPos.lat),
                lng: Number(centerPos.lng)
              },
              radius: 350
            },
            includedPrimaryTypes: [
              'restaurant',
              'meal_takeaway',
              'cafe',
              'bakery',
              'convenience_store'
            ],
            maxResultCount: 12,
            language: 'zh-TW'
          };
          if (SearchNearbyRankPreference?.DISTANCE) {
            request.rankPreference = SearchNearbyRankPreference.DISTANCE;
          }

          const { places } = await Place.searchNearby(request);
          if (Array.isArray(places) && places.length > 0) {
            const formatted = places
              .map((p) => parseNewPlaceObject(p, centerPos))
              .filter(Boolean);
            setNearbyPlaces(formatted);
            renderPlaceMarkers(formatted, gmaps, map);
          }
        } catch (err) {
          console.warn('Places API (New) searchNearby 失敗:', err);
        } finally {
          setSearchingPlaces(false);
        }
      };

      useEffect(() => {
        const cleanKey = (mapsKey || '').trim();
        if (!cleanKey) {
          setMapStatus('no_key');
          return;
        }

        let cancelled = false;
        setMapStatus('loading');
        setMapErrorMsg('');

        loadGoogleMapsApi(cleanKey)
          .then(async (gmaps) => {
            if (cancelled || !mapContainerRef.current) return;
            const centerPos = currentCoords
              ? { lat: Number(currentCoords.lat), lng: Number(currentCoords.lng) }
              : { lat: 25.033964, lng: 121.564468 };

            const map = new gmaps.Map(mapContainerRef.current, {
              center: centerPos,
              zoom: 17,
              disableDefaultUI: true,
              zoomControl: true,
              clickableIcons: true,
              styles: [
                { elementType: 'geometry', stylers: [{ color: '#0f172a' }] },
                { elementType: 'labels.text.stroke', stylers: [{ color: '#0f172a' }] },
                { elementType: 'labels.text.fill', stylers: [{ color: '#94a3b8' }] },
                {
                  featureType: 'poi',
                  elementType: 'labels.text.fill',
                  stylers: [{ color: '#34d399' }]
                },
                {
                  featureType: 'road',
                  elementType: 'geometry',
                  stylers: [{ color: '#1e293b' }]
                },
                {
                  featureType: 'water',
                  elementType: 'geometry',
                  stylers: [{ color: '#020617' }]
                }
              ]
            });

            mapInstanceRef.current = map;

            new gmaps.Marker({
              position: centerPos,
              map,
              title: '您目前的位置',
              icon: {
                path: gmaps.SymbolPath.CIRCLE,
                scale: 7,
                fillColor: '#38bdf8',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 2
              }
            });

            // 點擊地圖上的店家 POI 圖示時，使用新版 Place.fetchFields() 取得店家名稱與座標
            map.addListener('click', async (event) => {
              if (event.placeId) {
                event.stop();
                try {
                  const { Place } = await gmaps.importLibrary('places');
                  const place = new Place({
                    id: event.placeId,
                    requestedLanguage: 'zh-TW'
                  });
                  await place.fetchFields({
                    fields: ['id', 'displayName', 'formattedAddress', 'location']
                  });
                  const parsed = parseNewPlaceObject(place, centerPos);
                  onSelectPlace({
                    mode: 'place',
                    placeId: parsed?.placeId || event.placeId,
                    placeName: parsed?.placeName || '地圖所選店家',
                    address: parsed?.address || '',
                    lat: parsed?.lat ?? event.latLng?.lat?.() ?? centerPos.lat,
                    lng: parsed?.lng ?? event.latLng?.lng?.() ?? centerPos.lng
                  });
                } catch (err) {
                  console.warn('Places API (New) fetchFields 失敗:', err);
                  onSelectPlace({
                    mode: 'place',
                    placeId: event.placeId,
                    placeName: '地圖所選店家',
                    address: '',
                    lat: event.latLng?.lat?.() ?? centerPos.lat,
                    lng: event.latLng?.lng?.() ?? centerPos.lng
                  });
                }
              }
            });

            setMapStatus('ready');
            fetchNearbyFoodPlaces(gmaps, map, centerPos);
          })
          .catch((err) => {
            if (cancelled) return;
            setMapStatus('error');
            setMapErrorMsg(err?.message || 'Google Maps 載入失敗');
          });

        return () => {
          cancelled = true;
        };
      }, [mapsKey, mapsKeyVersion, currentCoords?.lat, currentCoords?.lng]);

      // 使用新版 Places API (New): Place.searchByText() 進行關鍵字搜尋
      const handleKeywordSearch = async (e) => {
        if (e) e.preventDefault();
        const q = searchQuery.trim();
        if (!q) return;

        if (
          mapStatus === 'ready' &&
          window.google?.maps &&
          mapInstanceRef.current
        ) {
          const gmaps = window.google.maps;
          const mapCenter = mapInstanceRef.current.getCenter();
          const centerPos = currentCoords
            ? { lat: Number(currentCoords.lat), lng: Number(currentCoords.lng) }
            : {
                lat: typeof mapCenter?.lat === 'function' ? mapCenter.lat() : 25.033964,
                lng: typeof mapCenter?.lng === 'function' ? mapCenter.lng() : 121.564468
              };

          setSearchingPlaces(true);
          try {
            const { Place } = await gmaps.importLibrary('places');
            const request = {
              textQuery: q,
              fields: ['id', 'displayName', 'formattedAddress', 'location', 'rating'],
              locationBias: {
                center: centerPos,
                radius: 1500
              },
              maxResultCount: 10,
              language: 'zh-TW'
            };

            const { places } = await Place.searchByText(request);
            if (Array.isArray(places) && places.length > 0) {
              const formatted = places
                .map((p) => parseNewPlaceObject(p, centerPos))
                .filter(Boolean);
              setNearbyPlaces(formatted);
              if (formatted[0]?.lat != null && formatted[0]?.lng != null) {
                mapInstanceRef.current.panTo({
                  lat: Number(formatted[0].lat),
                  lng: Number(formatted[0].lng)
                });
              }
              renderPlaceMarkers(formatted, gmaps, mapInstanceRef.current);
            } else {
              showToast?.(`找不到「${q}」的 Google 地圖結果，您可直接點選下方自訂店名進入 Step 2`);
            }
          } catch (err) {
            console.warn('Places API (New) searchByText 失敗:', err);
            showToast?.(`搜尋「${q}」時發生錯誤，您可直接點選「直接選此店 ➔」進入 Step 2`);
          } finally {
            setSearchingPlaces(false);
          }
        }
      };

      const displayedStores = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        const filteredHistory = visitedOrDefaultPlaces.filter(
          (p) =>
            !q ||
            p.placeName.toLowerCase().includes(q) ||
            (p.address && p.address.toLowerCase().includes(q))
        );

        if (nearbyPlaces.length > 0) {
          const seen = new Set(nearbyPlaces.map((p) => p.placeId || p.placeName));
          const merged = [...nearbyPlaces];
          for (const h of filteredHistory) {
            if (!seen.has(h.placeId) && !seen.has(h.placeName)) {
              merged.push(h);
            }
          }
          return merged;
        }
        return filteredHistory;
      }, [nearbyPlaces, visitedOrDefaultPlaces, searchQuery]);

      const handleSelectCustomGps = () => {
        const customLabel = customGpsName.trim();
        if (currentCoords) {
          onSelectPlace({
            mode: 'custom_gps',
            placeId: `gps_${currentCoords.lat.toFixed(4)}_${currentCoords.lng.toFixed(4)}`,
            placeName:
              customLabel ||
              `📍 自訂當前位置 (${currentCoords.lat.toFixed(4)}, ${currentCoords.lng.toFixed(4)})`,
            address: `GPS Haversine 25m 智慧座標綁定`,
            lat: currentCoords.lat,
            lng: currentCoords.lng
          });
          return;
        }

        if (typeof navigator !== 'undefined' && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              onSelectPlace({
                mode: 'custom_gps',
                placeId: `gps_${lat.toFixed(4)}_${lng.toFixed(4)}`,
                placeName:
                  customLabel ||
                  `📍 自訂當前位置 (${lat.toFixed(4)}, ${lng.toFixed(4)})`,
                address: `GPS Haversine 25m 智慧座標綁定`,
                lat,
                lng
              });
            },
            () => {
              onSelectPlace({
                mode: 'custom_gps',
                placeId: `gps_custom_manual`,
                placeName: customLabel || '📍 自訂當前位置攤販',
                address: '自訂位置（未開啟 GPS 權限）',
                lat: null,
                lng: null
              });
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 30000 }
          );
        } else {
          onSelectPlace({
            mode: 'custom_gps',
            placeId: `gps_custom_manual`,
            placeName: customLabel || '📍 自訂當前位置攤販',
            address: '自訂位置',
            lat: null,
            lng: null
          });
        }
      };

      return (
        <div className="space-y-4">
          {/* 頂部快速跳過或自訂座標按鈕區（選項 B 與 選項 C） */}
          <div className="bg-slate-900/95 border border-slate-800 rounded-3xl p-4 space-y-3 shadow-xl">
            <div className="flex items-center justify-between gap-2">
              <div>
                <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  STEP 1 · LOCATION FIRST
                </span>
                <h2 className="text-base font-black text-white mt-1">
                  📍 請先選擇這餐的用餐地點
                </h2>
                <p className="text-xs text-slate-400">
                  選好店家後系統會自動調出「📜 過去在此點過的餐點」，一鍵即可沿用紀錄！
                </p>
              </div>
            </div>

            {/* 選項 B 與 選項 C 雙主按鈕 */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
              <button
                type="button"
                onClick={() =>
                  onSelectPlace({
                    mode: 'none',
                    placeId: null,
                    placeName: '🏠 無特定店家 / 小零食 / 自行烹飪',
                    address: '跳過地點綁定，直接進行 AI 拍照或手動紀錄',
                    lat: null,
                    lng: null
                  })
                }
                className="min-h-[54px] px-4 py-3 rounded-2xl bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 text-left flex items-center justify-between gap-2 transition active:scale-98 group"
              >
                <div className="min-w-0">
                  <div className="text-xs font-black text-white group-hover:text-emerald-300 transition truncate">
                    🏠 無特定店家 / 小零食 / 自行烹飪
                  </div>
                  <div className="text-[11px] text-slate-400 truncate mt-0.5">
                    選項 B：跳過地點綁定，直接進入紀錄
                  </div>
                </div>
                <span className="text-emerald-400 font-black text-sm flex-shrink-0">➔</span>
              </button>

              <div className="bg-slate-950/90 border border-amber-500/35 rounded-2xl p-2.5 flex flex-col justify-between gap-2">
                <div className="flex items-center justify-between gap-1.5">
                  <div className="min-w-0">
                    <div className="text-xs font-black text-amber-300 truncate">
                      📍 自訂當前位置（Haversine 座標綁定）
                    </div>
                    <div className="text-[10px] text-slate-400 truncate">
                      選項 C：適合地圖找不到的巷口無名攤販/學餐
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowCustomGpsInput((v) => !v)}
                    className="text-[10px] px-2 py-1 rounded-lg bg-slate-800 text-slate-300 hover:text-white font-bold whitespace-nowrap"
                  >
                    {showCustomGpsInput ? '收合命名' : '＋備註攤名'}
                  </button>
                </div>

                {showCustomGpsInput && (
                  <input
                    type="text"
                    value={customGpsName}
                    onChange={(e) => setCustomGpsName(e.target.value)}
                    placeholder="選填攤販名稱（例：巷口無名水煎包、學餐自助餐）"
                    className="w-full h-8 bg-slate-900 border border-slate-700 rounded-xl px-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400"
                  />
                )}

                <button
                  type="button"
                  onClick={handleSelectCustomGps}
                  className="w-full py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-black transition active:scale-98"
                >
                  📡 使用當前 GPS 座標進入 Step 2 ➔
                </button>
              </div>
            </div>
          </div>

          {/* 選項 A：微型 Google Map 與 搜尋/附近店家列表 */}
          <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/30 border border-emerald-500/30 rounded-3xl p-4 space-y-3.5 shadow-xl">
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div>
                <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                  選項 A · GOOGLE MAPS & PLACES
                </span>
                <h3 className="text-sm font-black text-white mt-1">
                  🗺️ 點擊地圖店家 或 搜尋附近餐廳
                </h3>
              </div>
              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={onRefreshGps}
                  className="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-cyan-300 border border-slate-700 transition"
                >
                  📡 重新定位
                </button>
                <button
                  type="button"
                  onClick={onOpenCloudModal}
                  className="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-emerald-300 border border-slate-700 transition"
                >
                  🔑 Maps 金鑰設定
                </button>
              </div>
            </div>

            {/* 微型 Google Map 視窗 */}
            <div className="relative w-full h-52 rounded-2xl overflow-hidden border border-slate-800 bg-slate-950">
              <div ref={mapContainerRef} className="w-full h-full" />

              {mapStatus === 'no_key' && (
                <div className="absolute inset-0 bg-slate-950/95 p-4 flex flex-col items-center justify-center text-center gap-2">
                  <div className="text-2xl">🗺️</div>
                  <p className="text-xs font-extrabold text-white">
                    尚未設定 Google Maps API Key
                  </p>
                  <p className="text-[11px] text-slate-400 max-w-xs leading-relaxed">
                    設定金鑰後即可在此顯示互動式微型地圖並自動抓取附近餐廳；未設定時您仍可直接使用下方搜尋框與歷史/常用店家清單！
                  </p>
                  <button
                    type="button"
                    onClick={onOpenCloudModal}
                    className="mt-1 px-3.5 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow-md transition"
                  >
                    🔑 前往綁定 Maps API 金鑰
                  </button>
                </div>
              )}

              {mapStatus === 'loading' && (
                <div className="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center gap-2">
                  <div className="w-8 h-8 border-3 border-emerald-400 border-t-transparent rounded-full animate-spin" />
                  <p className="text-xs font-bold text-emerald-300">
                    正在載入微型 Google Map 與周邊店家...
                  </p>
                </div>
              )}

              {mapStatus === 'error' && (
                <div className="absolute inset-0 bg-slate-950/95 p-4 flex flex-col items-center justify-center text-center gap-2">
                  <p className="text-xs font-extrabold text-rose-400">
                    ⚠️ {mapErrorMsg}
                  </p>
                  <p className="text-[11px] text-slate-400">
                    請確認您的 Google Maps API Key 是否正確且已啟用 Maps JavaScript API & Places API。您仍可直接使用下方清單或輸入店名！
                  </p>
                  <button
                    type="button"
                    onClick={onOpenCloudModal}
                    className="px-3 py-1.5 rounded-xl bg-slate-800 text-emerald-300 border border-slate-700 text-xs font-bold"
                  >
                    🔑 檢查 Maps 金鑰
                  </button>
                </div>
              )}
            </div>

            {/* 搜尋 / 自訂輸入店家名稱列 */}
            <form onSubmit={handleKeywordSearch} className="flex gap-2">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="🔍 搜尋店名或直接輸入餐廳名稱（例：Subway、八方雲集、麥當勞）"
                className="flex-1 min-h-[44px] bg-slate-950/90 border border-slate-800 rounded-2xl px-3.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400"
              />
              {mapStatus === 'ready' && (
                <button
                  type="submit"
                  disabled={searchingPlaces}
                  className="px-3.5 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs whitespace-nowrap transition disabled:opacity-50"
                >
                  {searchingPlaces ? '搜尋中...' : '地圖搜尋'}
                </button>
              )}
              {searchQuery.trim() && (
                <button
                  type="button"
                  onClick={() =>
                    onSelectPlace({
                      mode: 'place',
                      placeId: `custom_store_${searchQuery.trim()}`,
                      placeName: searchQuery.trim(),
                      address: '手動指定店家名稱',
                      lat: currentCoords?.lat ?? null,
                      lng: currentCoords?.lng ?? null
                    })
                  }
                  className="px-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs whitespace-nowrap transition"
                >
                  直接選此店 ➔
                </button>
              )}
            </form>

            {/* 附近店家 / 曾造訪店家列表 */}
            <div className="space-y-2">
              <div className="flex items-center justify-between text-[11px] text-slate-400 font-bold px-1">
                <span>
                  {nearbyPlaces.length > 0
                    ? '📍 附近店家與曾造訪餐廳（點擊即選取進入 Step 2）'
                    : '🏪 曾造訪店家與常見增肌外食地點（點擊即選取進入 Step 2）'}
                </span>
                <span>共 {displayedStores.length} 間</span>
              </div>

              <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                {displayedStores.map((store) => (
                  <button
                    key={store.placeId || store.placeName}
                    type="button"
                    onClick={() =>
                      onSelectPlace({
                        mode: 'place',
                        placeId: store.placeId,
                        placeName: store.placeName,
                        address: store.address || '',
                        lat: store.lat ?? currentCoords?.lat ?? null,
                        lng: store.lng ?? currentCoords?.lng ?? null
                      })
                    }
                    className="w-full text-left bg-slate-950/90 hover:bg-slate-900 hover:border-emerald-400/60 border border-slate-800/90 rounded-2xl p-3 flex items-center justify-between gap-2.5 transition group"
                  >
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5 flex-wrap">
                        <span className="text-xs font-extrabold text-white group-hover:text-emerald-300 transition truncate">
                          🏪 {store.placeName}
                        </span>
                        {store.isHistory && (
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold">
                            📜 有歷史菜單
                          </span>
                        )}
                        {store.distanceM != null && (
                          <span className="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 font-bold">
                            距離 {store.distanceM}m
                          </span>
                        )}
                        {store.rating && (
                          <span className="text-[10px] text-amber-400 font-bold">
                            ★ {store.rating}
                          </span>
                        )}
                      </div>
                      {store.address && (
                        <p className="text-[11px] text-slate-400 truncate mt-0.5">
                          {store.address}
                        </p>
                      )}
                    </div>
                    <span className="text-xs font-black text-emerald-400 whitespace-nowrap flex-shrink-0">
                      選這家 ➔
                    </span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CloudConfigModal({ user, profile, onClose, onSaved }) {
      const [geminiKey, setGeminiKey] = useState(() => getSavedGeminiKey());
      const [mapsKey, setMapsKey] = useState(() => getSavedMapsKey());
      const [firebaseJson, setFirebaseJson] = useState(() => {
        const cfg = getSavedFirebaseConfig();
        return cfg ? JSON.stringify(cfg, null, 2) : '';
      });
      const [error, setError] = useState('');
      const [saving, setSaving] = useState(false);

      const handleSave = async (e) => {
        e.preventDefault();
        setError('');
        const trimmedGeminiKey = (geminiKey || '').trim();
        const trimmedMapsKey = (mapsKey || '').trim();
        saveGeminiKey(trimmedGeminiKey);
        saveMapsKey(trimmedMapsKey);
        if (firebaseJson.trim()) {
          try {
            const parsed = JSON.parse(firebaseJson);
            if (!parsed.apiKey || !parsed.projectId) {
              setError('Firebase 設定需包含 apiKey 與 projectId 欄位');
              return;
            }
            saveFirebaseConfig(parsed);
          } catch (err) {
            setError('Firebase Config JSON 格式不正確，請確認為合法 JSON 物件');
            return;
          }
        } else {
          saveFirebaseConfig(null);
        }

        let updatedProfile = null;
        if (user?.uid) {
          setSaving(true);
          try {
            updatedProfile = await saveUserProfile(user.uid, {
              ...(profile || {}),
              geminiKey: trimmedGeminiKey,
              mapsKey: trimmedMapsKey
            });
          } catch (err) {
            console.warn('同步 Gemini / Maps Key 至雲端失敗:', err);
          } finally {
            setSaving(false);
          }
        }
        onSaved(updatedProfile);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-[#0E1525] border border-slate-700 rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <h3 className="text-base font-black text-white">🔑 設定 Gemini / Maps API 金鑰與雲端同步</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold">✕</button>
            </div>

            <form onSubmit={handleSave} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-emerald-400 mb-1">
                  Gemini API Key (用於 AI 食物拍照與文字估算)
                </label>
                <input
                  type="password"
                  value={geminiKey}
                  onChange={(e) => setGeminiKey(e.target.value)}
                  placeholder="貼上你的 AIzaSy... Gemini API Key"
                  className="w-full h-11 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs text-white focus:outline-none focus:border-emerald-400"
                />
                <p className="text-[11px] text-slate-400 mt-1">
                  可從 Google AI Studio 取得。登入狀態下儲存將自動同步至雲端 Profile！
                </p>
              </div>

              <div>
                <label className="block text-xs font-bold text-amber-400 mb-1">
                  Google Maps API Key (用於 Step 1 微型地圖與附近店家搜尋)
                </label>
                <input
                  type="password"
                  value={mapsKey}
                  onChange={(e) => setMapsKey(e.target.value)}
                  placeholder="貼上你的 AIzaSy... Google Maps API Key"
                  className="w-full h-11 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs text-white focus:outline-none focus:border-amber-400"
                />
                <p className="text-[11px] text-slate-400 mt-1">
                  同步寫入 Firebase 的 userProfile 中，只要登入帳號就會自動載入 Gemini 與 Maps 兩把金鑰到本機！
                </p>
              </div>

              <div>
                <label className="block text-xs font-bold text-cyan-400 mb-1">
                  Firebase Config JSON (選填，用於跨裝置 Firestore 雲端同步)
                </label>
                <textarea
                  rows={4}
                  value={firebaseJson}
                  onChange={(e) => setFirebaseJson(e.target.value)}
                  placeholder={`{\n  "apiKey": "AIza...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app"\n}`}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-white focus:outline-none focus:border-cyan-400"
                />
              </div>

              {error && <p className="text-xs font-bold text-rose-400">{error}</p>}

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 h-11 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold"
                >
                  取消
                </button>
                <button
                  type="submit"
                  disabled={saving}
                  className="flex-1 h-11 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black disabled:opacity-50"
                >
                  {saving ? '雲端同步中...' : '儲存並綁定雲端'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
